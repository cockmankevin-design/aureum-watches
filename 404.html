<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HOURLEIGH</title>
<meta name="robots" content="noindex" />
<!-- spa-github-pages redirect: preserves the requested path and hands it to
     index.html, which decodes it (see the decode script in index.html <head>).
     The app lives at the domain root, so pathSegmentsToKeep = 0. -->
<script>
  var pathSegmentsToKeep = 0;
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#F7F5F0;color:#141414;font-family:Jost,sans-serif;text-align:center}
  .box{padding:40px 24px;max-width:520px}
  .eyebrow{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:#9A7A2E;font-weight:500}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(2.2rem,6vw,3.4rem);
    line-height:1.05;margin:.4em 0 .5em}
  p{color:#6E675C;font-weight:300;margin:0 0 30px}
  a{display:inline-block;background:#141414;color:#F7F5F0;text-decoration:none;border:1px solid #141414;
    font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:1.05em 2em;transition:.3s}
  a:hover{background:transparent;color:#141414}
</style>
</head>
<body>
  <!-- Shown only if JavaScript is disabled; the redirect above handles everyone else. -->
  <div class="box">
    <span class="eyebrow">HOURLEIGH</span>
    <h1>Taking you to the collection&hellip;</h1>
    <p>If you are not redirected automatically, continue below.</p>
    <a href="/">Enter the Store</a>
  </div>
</body>
</html>
